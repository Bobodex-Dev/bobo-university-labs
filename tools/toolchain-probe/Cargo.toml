[package]
name = "toolchain-probe"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.2.1", default-features = false, features = ["solana-v4"] }
mpl-core = "=0.12.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
litesvm = "=0.17.0"
solana-instruction = "3.5"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-pubkey = "4"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
